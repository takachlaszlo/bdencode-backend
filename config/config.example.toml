[bdencode]
data_root = "/home/accofil/encode"
source_roots = ["/home/accofil/storage"]
bind_host = "127.0.0.1"
bind_port = 8796
api_root_path = "/encoder"
worker_poll_seconds = 2.0
cpu_limit_percent = 80
comparison_pair_count = 24
# A korábbi comparison_frames_per_type kulcs kompatibilitási okból még betölthető,
# de az új, mintavételezett comparison nem használja.
log_level = "INFO"
ai_model = "gpt-5.6-terra"
ai_timeout_seconds = 60
release_profiles_path = "/etc/bdencode/release-profiles.json"
# Automatikus SQLite mentés a <data_root>/state/backups mappába (0 = kikapcsolva).
backup_interval_hours = 24
backup_keep_scheduled = 14
# A kiválasztott cím lemezfájljainak helyi másolata a referencia-remux előtt:
# "auto" = csak lassú (hálózati / WSL 9p) csatoláson, "always", "never".
source_staging = "auto"
# A teljes című crop-keresés dekódolása: "auto" = NVDEC, ha elérhető (hibánál CPU),
# "cuda" = mindig NVDEC, "none" = mindig CPU.
crop_hwaccel = "auto"
# A referencia VapourSynth-forrása: "lsmas" (L-SMASH, UHD-n kb. 90 mp-es index)
# vagy "bestsource" (minden képkockát dekódol az indexhez, UHD-n kb. 45 perc).
source_filter = "lsmas"
