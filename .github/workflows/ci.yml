name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify committed frontend release is current
        run: test -z "$(git status --porcelain -- dist)"

  python:
    name: python (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Windows is where the installer is used first; the whole suite runs
          # there so path, quoting and encoding mistakes (a "C:\Users" inside a
          # TOML string, a console code page ...) surface immediately.  The
          # windows-latest image has both PowerShell 7 and Windows PowerShell
          # 5.1, and tests/test_windows_install_powershell.py runs under each.
          # Python 3.13 on purpose: it is what the Windows PC runs, and up to
          # 3.12 the Linux-only installer and worker tests fail on Windows for
          # platform reasons (os.fchmod does not exist there, and time.time()
          # is a coarse clock that lags the NTFS mtime of a file written just
          # before it).  The 3.11 and 3.12 legs on Linux cover those versions.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: PowerShell versions available to the installer tests
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($IsWindows) { powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' }
      # Without the media tools every real-ffmpeg test is skipped, and those tests are
      # what guards the encoder pipe (colour conversion, 10-bit Y4M, muxing).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix mediainfo
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E 'libx26[45]' || true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - if: runner.os == 'Linux'
        run: python -m compileall -q src
      - if: runner.os == 'Linux'
        run: git diff --check

  scripts:
    name: installer scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax of every shell script
        run: |
          set -eu
          for script in install/*.sh; do
            bash -n "$script"
            echo "ok $script"
          done
      - name: The installer reference is the LF version stored in git
        run: |
          if grep -rlI $'\r' install deploy --include='*.sh' --include='*.in' --include='*.service' --include='*.conf'; then
            echo "CRLF found in a Linux-side script or template" >&2
            exit 1
          fi

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential libbluray-dev pkg-config
      - run: make -C native
      - run: native/bdencode-libbluray-scan --help
