name: Release

# A vX.Y.Z tag is what the daily updater installs, so a wrong one must not stand: the job fails
# loudly when the tag, the version files and the release notes disagree, and publishes the
# GitHub Release (notes = docs/RELEASE_*.md) when it does not exist yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag, version files and release notes agree
        run: python tools/release.py check "$GITHUB_REF_NAME"
      - name: Publish the GitHub Release when it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          python tools/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "BDEncode ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --latest
