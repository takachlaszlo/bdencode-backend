[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdencode-backend"
version = "0.1.0"
description = "Headless, persistent Blu-ray and UHD Blu-ray encoding backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BDEncode contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
language = [
  "faster-whisper==1.2.1",
]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
bdencode = "bdencode.cli:main"
bdencode-vmaf = "bdencode.vmaf_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bdencode"]
